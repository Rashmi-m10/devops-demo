permissions:
  contents: read
  packages: write
 
env:
  IMAGE: ghcr.io/rashmi-m10/devops-demo:latest
 
  # ...build-test job unchanged...
 
  package:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build image
        run: docker build -t $IMAGE .
      - name: Push image
        run: docker push $IMAGE
